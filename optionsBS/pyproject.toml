[project]
name = "spotmm"
version = "0.1.0"
description = "Option market making under one-factor spot models (Black-Scholes, local vol): the BBG example without the two simplifying assumptions"
requires-python = ">=3.11"
dependencies = ["jax>=0.4.30", "numpy", "scipy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running"]
